<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grill Me 珠宝</title>
  <style>
    :root{color-scheme:light dark;--ink:#151515;--muted:#707070;--line:color-mix(in srgb,currentColor 13%,transparent);--panel:color-mix(in srgb,currentColor 4%,transparent);--gold:#b88a35}
    *{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:transparent;font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    body{padding:18px 20px 16px}.app{max-width:920px;margin:0 auto}.loading{min-height:260px;display:grid;place-content:center;text-align:center;color:var(--muted);gap:12px}.mark{font:700 17px/1 Georgia,serif;color:var(--gold);letter-spacing:.12em}
    header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:15px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.title{font-size:24px;line-height:1.2;margin:4px 0 5px}.intro{color:var(--muted);max-width:680px}.progress{white-space:nowrap;font-size:13px;color:var(--muted);padding-top:5px}.bar{height:3px;background:var(--line);margin-bottom:18px}.bar>i{display:block;height:100%;background:var(--ink);transition:width .2s ease}
    fieldset{border:0;margin:0;padding:0;min-height:190px}legend{font-size:19px;font-weight:700;padding:0;margin-bottom:5px}.help{color:var(--muted);margin-bottom:13px}.required{color:var(--gold);font-size:12px;margin-left:6px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:block;position:relative}.option input{position:absolute;opacity:0;pointer-events:none}.option span{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:52px;background:var(--panel);cursor:pointer;transition:.15s}.option b{display:block;font-size:15px}.option small{display:block;color:var(--muted);margin-top:2px}.option input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}.option input:checked+span{background:var(--ink);color:white;border-color:var(--ink)}.option input:checked+span small{color:#d8d8d8}
    textarea,.other{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:inherit;padding:12px 13px;font:inherit;resize:none;outline:none}.other{margin-top:9px;height:44px}.other:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 18%,transparent)}textarea{height:126px}.error{min-height:21px;color:#b42318;font-size:13px;margin-top:8px}
    footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;padding-top:13px}.actions{display:flex;gap:9px;margin-left:auto}button{border:0;border-radius:999px;padding:10px 17px;font:700 14px/1 inherit;cursor:pointer}.ghost{background:transparent;color:inherit;border:1px solid var(--line)}.primary{background:#111;color:#fff}.primary:disabled{opacity:.42;cursor:not-allowed}.submitted{min-height:250px;display:grid;place-content:center;text-align:center;gap:8px}.submitted h2{margin:0;font-size:22px}.submitted p{margin:0;color:var(--muted)}
    @media(max-width:620px){body{padding:14px}.title{font-size:21px}.options{grid-template-columns:1fr}fieldset{min-height:220px}.progress{font-size:12px}header{gap:8px}}
    @media(prefers-color-scheme:dark){:root{--ink:#f4f4f4;--muted:#aaa;--gold:#d0a54e}.primary{background:#f5f5f5;color:#111}.option input:checked+span{background:#f5f5f5;color:#111}.option input:checked+span small{color:#555}}
  </style>
</head>
<body>
  <main class="app" id="app"><section class="loading" id="loading"><div class="mark">GMJ</div><div>正在载入访谈问题…</div></section></main>
  <script>
  (()=>{
    "use strict";
    const UI_VERSION="2026-01-26";let active=null,index=0,answers={},otherText={},connected=false,seq=1;const pending=new Map();
    const app=document.getElementById("app");
    const send=(message)=>window.parent.postMessage(message,"*");
    const request=(method,params)=>new Promise((resolve,reject)=>{const id=seq++;pending.set(id,{resolve,reject});send({jsonrpc:"2.0",id,method,params})});
    const notify=(method,params)=>send({jsonrpc:"2.0",method,params});
    const resize=()=>requestAnimationFrame(()=>notify("ui/notifications/size-changed",{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight}));
    new ResizeObserver(resize).observe(document.body);
    const parse=(value,depth=0)=>{if(depth>8||value==null)return null;if(typeof value==="string"){try{return parse(JSON.parse(value),depth+1)}catch{return null}}if(Array.isArray(value)){for(const item of value){const found=parse(item,depth+1);if(found)return found}return null}if(typeof value!=="object")return null;if(value.interview?.questions)return value.interview;if(value.structuredContent)return parse(value.structuredContent,depth+1);if(value.result)return parse(value.result,depth+1);if(value.content)return parse(value.content,depth+1);if(value.text)return parse(value.text,depth+1);return null};
    const toolError=(value,depth=0)=>{if(depth>8||value==null)return "";if(typeof value==="string"){try{return toolError(JSON.parse(value),depth+1)}catch{return ""}}if(Array.isArray(value)){for(const item of value){const found=toolError(item,depth+1);if(found)return found}return ""}if(typeof value!=="object")return "";if(value.isError){const message=Array.isArray(value.content)?value.content.find(item=>item?.type==="text")?.text:"";return message||value.error?.message||"表单载入失败。"}for(const key of ["result","structuredContent","content","text"]){const found=toolError(value[key],depth+1);if(found)return found}return ""};
    const terminal=(message)=>{active=null;app.innerHTML=`<section class="loading"><div class="mark">GMJ</div><div>${escapeHtml(message)}</div></section>`;resize()};
    const escapeHtml=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const hasAnswer=(q)=>q.type==="multi"?Array.isArray(answers[q.id])&&answers[q.id].length>0:String(answers[q.id]??"").trim().length>0;
    function optionMarkup(q,o){const checked=q.type==="multi"?(answers[q.id]||[]).includes(o.value):answers[q.id]===o.value;return `<label class="option"><input type="${q.type==="multi"?"checkbox":"radio"}" name="${escapeHtml(q.id)}" value="${escapeHtml(o.value)}" ${checked?"checked":""}><span><b>${escapeHtml(o.label)}</b>${o.description?`<small>${escapeHtml(o.description)}</small>`:""}</span></label>`}
    function render(){if(!active)return;const q=active.questions[index];const selectedOther=q.type==="multi"?(answers[q.id]||[]).includes("other"):answers[q.id]==="other";app.innerHTML=`<header><div><div class="eyebrow">Grill Me Jewel · Round ${active.round}</div><h1 class="title">${escapeHtml(active.title)}</h1>${active.intro?`<div class="intro">${escapeHtml(active.intro)}</div>`:""}</div><div class="progress">${index+1} / ${active.questions.length}</div></header><div class="bar"><i style="width:${((index+1)/active.questions.length)*100}%"></i></div><fieldset><legend>${escapeHtml(q.label)}${q.required?'<span class="required">必答</span>':""}</legend>${q.help?`<div class="help">${escapeHtml(q.help)}</div>`:""}${q.type==="text"?`<textarea id="textAnswer" maxlength="800" placeholder="${escapeHtml(q.placeholder||"请写下你的想法")}">${escapeHtml(answers[q.id]||"")}</textarea>`:`<div class="options">${q.options.map(o=>optionMarkup(q,o)).join("")}</div>${selectedOther?`<input class="other" id="otherAnswer" maxlength="160" placeholder="请补充具体方向" value="${escapeHtml(otherText[q.id]||"")}">`:""}`}<div class="error" id="error"></div></fieldset><footer><button class="ghost" id="back" ${index===0?"disabled":""}>上一题</button><div class="actions">${index<active.questions.length-1?'<button class="primary" id="next">下一题</button>':`<button class="primary" id="submit">${escapeHtml(active.submitLabel)}</button>`}</div></footer>`;
      bind(q);resize();
    }
    function bind(q){if(q.type==="text")document.getElementById("textAnswer").addEventListener("input",e=>answers[q.id]=e.target.value);else document.querySelectorAll(`input[name="${CSS.escape(q.id)}"]`).forEach(input=>input.addEventListener("change",e=>{if(q.type==="multi"){const set=new Set(answers[q.id]||[]);e.target.checked?set.add(e.target.value):set.delete(e.target.value);answers[q.id]=[...set]}else answers[q.id]=e.target.value;render()}));document.getElementById("otherAnswer")?.addEventListener("input",e=>otherText[q.id]=e.target.value);document.getElementById("back").onclick=()=>{if(index>0){index--;render()}};document.getElementById("next")?.addEventListener("click",()=>{if(validate(q)){index++;render()}});document.getElementById("submit")?.addEventListener("click",()=>{if(validate(q))submit()})}
    function validationMessage(q){if(q.required&&!hasAnswer(q))return "请先完成这一题。";const selected=q.type==="multi"?(answers[q.id]||[]).includes("other"):answers[q.id]==="other";if(selected&&!String(otherText[q.id]||"").trim())return "请补充“其他”的具体内容。";return ""}
    function validate(q){const message=validationMessage(q);document.getElementById("error").textContent=message;return !message}
    const answerLabel=(q)=>{const raw=answers[q.id];if(q.type==="text")return String(raw||"").trim();const values=Array.isArray(raw)?raw:[raw];return values.filter(Boolean).map(v=>v==="other"?`其他：${String(otherText[q.id]||"").trim()}`:(q.options.find(o=>o.value===v)?.label||v)).join("、")};
    async function submit(){const invalid=active.questions.findIndex(q=>validationMessage(q));if(invalid>=0){index=invalid;render();document.getElementById("error").textContent=validationMessage(active.questions[invalid]);return}const payload={schemaVersion:1,round:active.round,answers:active.questions.map(q=>({id:q.id,value:answers[q.id]??(q.type==="multi"?[]:""),...(otherText[q.id]?{otherText:otherText[q.id]}:{})}))};const summary=active.questions.map(q=>`- ${q.label}：${answerLabel(q)||"未填写"}`).join("\n");const message=`已完成 Grill Me 珠宝第 ${active.round} 轮。\n${summary}\nCurrent widget context (JSON): ${JSON.stringify(payload)}`;try{if(connected){await request("ui/message",{role:"user",content:[{type:"text",text:message}]})}else if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt:message})}else throw new Error("host message capability unavailable");app.innerHTML='<section class="submitted"><div class="mark">GMJ</div><h2>本轮已提交</h2><p>我会根据你的回答继续收敛设计方向。</p></section>';resize()}catch(e){document.getElementById("error").textContent="提交失败，请重试。"}}
    function accept(value){const candidate=parse(value);if(!candidate)return false;if(!Array.isArray(candidate.questions)||candidate.questions.length<1){terminal("访谈问题不完整，请重新发起。");return true}active=candidate;index=0;answers={};otherText={};render();return true}
    window.addEventListener("message",event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=="2.0")return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return}if(m.method==="ui/notifications/tool-result"){const message=toolError(m.params);if(message){terminal(message);return}if(!accept(m.params))terminal("访谈问题不完整，请重新发起。")}if(m.method==="ui/notifications/tool-input"&&m.params?.arguments?.interview)accept(m.params.arguments)});
    async function connect(){try{const result=await request("ui/initialize",{appInfo:{name:"grill-me-jewel-interview",version:"0.1.0"},appCapabilities:{availableDisplayModes:["inline"]},protocolVersion:UI_VERSION});connected=Boolean(result?.hostCapabilities?.message?.text);notify("ui/notifications/initialized",{})}catch{}if(!active){const message=toolError(window.openai?.toolOutput);if(message)terminal(message);else accept(window.openai?.toolOutput)}}
    connect();setTimeout(()=>{if(!active)terminal("没有收到访谈问题，请重新调用 Grill Me 珠宝表单。")},9000);
  })();
  </script>
</body>
</html>
